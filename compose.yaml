# Despliegue del portfolio en la Raspberry Pi (D9):
# publicado en loopback para que lo alcance cloudflared.
# Convención: /home/pi/apps/portfolio/compose.yaml con este mismo contenido.

services:
  portfolio:
    build:
      context: .
      dockerfile: Dockerfile
    image: portfolio:latest
    container_name: portfolio
    restart: unless-stopped
    ports:
      - '127.0.0.1:18081:80'
