# nginx para el portfolio: sitio estático prerenderizado con fallback SPA.
# Si existe el HTML prerenderizado de la ruta se sirve; si no (rutas de cliente
# o navegación directa), cae a index.html de la app Angular.

server {
    listen 80;
    server_name _;

    # Redirecciones relativas (trailing slash de directorios): sin esto,
    # nginx monta Location absolutos con http:// y sin puerto, rompiendo
    # local (:18081) y detrás de cloudflared (https).
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    # SEG-3: no dejar que el navegador adivine el content-type.
    add_header X-Content-Type-Options "nosniff" always;

    # SEG-3: dotfiles fuera (no publicamos ninguno).
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # SPA + prerender: fichero existente -> se sirve; si no -> index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Contenido Markdown cargado por la app (httpResource): UTF-8 siempre.
    location /content/ {
        try_files $uri =404;
        types {
            text/markdown md;
            text/plain txt;
        }
        charset utf-8;
    }

    # El CV se sirve si existe; si no, 404 limpio (el botón va deshabilitado).
    location /cv/ {
        try_files $uri =404;
    }

    # Assets con hash en el nombre: caché larga e inmutable.
    # (se repite nosniff: un add_header en location sustituye al del server)
    location ~* \.(?:css|js|mjs|woff2?|ico|svg|png|jpg|jpeg|webp|avif)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }
}
