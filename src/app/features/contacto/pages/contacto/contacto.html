<section>
  <h1>Contacto</h1>
  <app-markdown ruta="secciones/contacto.md" />
</section>

<section aria-labelledby="canales">
  <h2 id="canales">Canales</h2>
  <div class="l-acciones">
    <a matButton="filled" [href]="'mailto:' + perfil.email">
      <span class="material-symbols-rounded" aria-hidden="true">mail</span>
      Contactarme
    </a>
    <a matButton="outlined" [href]="perfil.github" target="_blank" rel="noopener noreferrer">
      GitHub
    </a>
    <a matButton="outlined" [href]="perfil.linkedin" target="_blank" rel="noopener noreferrer">
      LinkedIn
    </a>
  </div>
  <p class="contacto__email">{{ perfil.email }}</p>
</section>
